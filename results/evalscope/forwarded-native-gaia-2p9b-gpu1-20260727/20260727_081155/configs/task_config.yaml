dataset_args:
  gaia:
    aggregation: mean
    data_statistics: null
    dataset_id: gaia-benchmark/GAIA
    default_subset: 2023_level1
    description: "\n## Overview\n\nGAIA (General AI Assistants) is a benchmark of\
      \ 450+ questions targeting next-generation LLMs with tool use, web browsing\
      \ and multi-step reasoning. Each question has an unambiguous short answer and\
      \ is bucketed into one of three difficulty levels.\n\n## Task Description\n\n\
      - **Task Type**: Tool-use Agent (multi-turn)\n- **Input**: Natural-language\
      \ question, optionally with one referenced attachment file (PDF / xlsx / image\
      \ / audio / ...)\n- **Output**: A short final answer (number / short phrase\
      \ / comma-separated list)\n- **Splits**: ``validation`` (answers public) and\
      \ ``test`` (answers private — evaluation skipped)\n\n## Key Features\n\n- ReAct\
      \ agent loop with a single ``bash`` tool inside a Docker sandbox (default image\
      \ ``python:3.11``, includes ``curl`` / ``wget`` / ``git``).\n- Attachment files\
      \ are mounted read-only at ``/shared_files`` inside the sandbox.\n- Rule-based\
      \ scorer ported verbatim from the official GAIA leaderboard (no LLM judge).\n\
      - Dataset downloaded from ModelScope (``gaia-benchmark/GAIA``) by default; set\
      \ ``dataset_hub='huggingface'`` to load from Hugging Face instead.\n\n## Evaluation\
      \ Notes\n\n- Requires Docker daemon running locally (or a remote sandbox engine\
      \ via the ms_enclave configuration).\n- The agent loop defaults to 50 steps.\
      \ Use ``NativeAgentConfig.max_steps`` to override it.\n- Network is enabled\
      \ by default because many questions require browsing. Override the image, network,\
      \ CPU or memory\n  settings through ``TaskConfig.sandbox.default_config``.\n\
      - Use ``subset_list`` to restrict to specific difficulty levels, e.g. ``['2023_level1']``,\
      \ ``['2023_level1', '2023_level2']`` or ``['2023_all']`` (default).\n- [Usage\
      \ Documentation](https://evalscope.readthedocs.io/en/latest/third_party/gaia.html)\n"
    eval_split: validation
    extra_params: {}
    few_shot_num: 0
    few_shot_prompt_template: null
    few_shot_random: false
    filters: null
    force_redownload: false
    max_image_bytes: null
