# Server evaluation preset. Endpoint, API keys, judge, and database live in .env.remote.

[prompt]
mode = "normal_nocot"
template = "User✿{query}✿\nBot✿<think></think"
strip_terminal_flower = true
allowed_domains = ["math", "coding", "instruction_following", "knowledge"]

[prompt.domains.coding]
template = "User✿{query}\nOutput only one fenced code block.✿\nBot✿<think></think"

[prompt.domains.knowledge]
template = "User✿{query}\nGive only the final answer. For multiple-choice questions, give only the option letter.✿\nBot✿<think></think"

[stops]
inherit_task_stops = false

[stops.domains]
math = ["✿"]
coding = ["✿"]
instruction_following = ["✿"]
knowledge = ["✿"]

[sampling]
max_tokens = 2048
temperature = 0.96
top_p = 0.76
top_k = 32
presence_penalty = 1.0
frequency_penalty = 0.1
penalty_decay = 0.988

[sampling.domains.instruction_following]
max_tokens = 1280

[sampling.domains.math]
max_tokens = 2048

[sampling.domains.knowledge]
max_tokens = 512

[lighteval]
provider = "openai"
output_dir = "results/lighteval"
save_details = false
dataset_loading_processes = 1
load_tasks_multilingual = false
custom_tasks = "src/cli/helicopter_cli/lighteval_policy_tasks.py"
concurrent_requests = 8
request_timeout = 900

[lighteval.g1h]
metric = "avg"
prompt_style = "normal"
zero_shot = true
avg_k = 8
rollout_n = 8
target_generations_per_benchmark = 5000
large_benchmark_generation_threshold = 20000
large_benchmark_sample_rate = 0.2
generation_size = 2048
gpass_generation_size = 4096
variant_selection = "avg_then_gpass"

[function_calling]
concurrent_requests = 8
request_timeout = 180

[models.deployed]
served_model_name = "rwkv7-g1h-1.5b-20260710-ctx10240"
max_model_len = 10240
max_num_seqs = 1024
max_num_batched_tokens = 32768
