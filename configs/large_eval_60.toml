# Curated high-recognition suite for the four deployed RWKV7 G1H endpoints.
# The benchmark TOMLs remain the source of sampling/metric policy; this file
# only selects the suite and declares the additional CoT wave. Coding and
# Instruction Following intentionally stay NoCoT-only in this manifest.

[run]
model_catalog = "configs/models/g1h-single-replica.toml"
models = ["g1h-1.5b", "g1h-2.9b", "g1h-7.2b", "g1h-13.3b"]
base_modes = ["naive_nocot", "normal_nocot"]
cot_fields = ["math", "knowledge"]
cot_modes = ["naive_cot", "normal_cot"]
# The RWKV vLLM endpoints expose max-num-seqs=1024. With rollout_n=4,
# sixteen HTTP workers keep about 64 native decode sequences in flight.
request_concurrency = 16
proxy_url = "http://192.168.0.243:7890"

[[benchmarks]]
field = "math"
config = "configs/benchmarks/g1h/math/058_math_500.toml"
task = "math_500"
skip = true

