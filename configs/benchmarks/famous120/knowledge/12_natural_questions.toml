# famous120 benchmark specification; prompt text remains the raw official item.

[benchmark]
field = "knowledge"
ordinal = 12
name = "natural_questions"
label = "Natural Questions"
task = "natural_questions"
allowed_modes = ["naive_cot", "normal_cot", "naive_nocot", "normal_nocot"]

[dataset]
source = "google-research-datasets/natural_questions"
source_status = "verified_identifier"
prompt_contract = "raw_question_only"
gold_contract = "final_answer_only"

[prompt]
format = "open_qa"
raw_question_only = true
add_instructions = false
add_fewshot_cue = false

[judge]
enabled = true
contract = "reference_candidate"
primary_score = true

[evaluation]
metric = "avg"
avg_k = 8
rollout_n = 8
target_generations_per_benchmark = 5000
large_benchmark_generation_threshold = 20000
large_benchmark_sample_rate = 0.2

[sampling]
max_tokens = 512
