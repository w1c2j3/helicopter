# Environment-specific values live in .env.local or .env.remote:
# WEIGHT_PATH, DATASETS_PATH, GPU counts, venv paths, and machine-local paths.
# Select experiments with --config; without --config, the CLI uses the newest
# configs/local/*.toml file.

[paths]
# vllm-rwkv is an independent checkout, not a Helicopter submodule.
vllm_rwkv_path = "../vllm-rwkv"

[infer]
enable_auto_tool_choice = false

[lighteval]
provider = "openai"
base_url = "http://127.0.0.1:8000/v1"
output_dir = "results/lighteval"
save_details = true
dataset_loading_processes = 1
load_tasks_multilingual = true
custom_tasks = "src/cli/helicopter_cli/lighteval_policy_tasks.py"
max_new_tokens = 512

[function_calling]
output_dir = "results/function_calling"
max_new_tokens = 768
concurrent_requests = 1
request_timeout = 120
server_timeout = 600

[performance]
# profile = "decode"
# prompt_tokens = 128
# output_tokens = 256
# requests = 8
# concurrency = 1
# output = "results/performance/latest.json"

[eval.batch]
# models = ["g1d-0.4b"]
# tasks = ["gsm8k|0"]
# fc_tasks = ["bfcl_v3"]
# output = "results/eval_batch/latest.json"

[agent_harness]
output_dir = "results/agent_harness"
n_concurrent = 1

[evalscope]
# Install the optional dependency group first: uv sync --group agent.
binary = "evalscope"
output_dir = "results/evalscope"
eval_type = "openai_api"
eval_batch_size = 1
naive_chat_proxy = true
generation_config = { max_tokens = 1024, temperature = 0.0 }
# datasets = ["swe_bench_verified_agentic"]
# mode = "native"
# generation_config = { max_tokens = 4096, temperature = 0.0 }

[evalscope.agent_config]
strategy = "function_calling"
tools = ["bash"]
environment = "docker"
max_steps = 10

[takeoff.grpo]
project_name = "verl_rwkv_grpo"
experiment_name = "rwkv7_grpo_vllm"
wkv_mode = "fp32io16"
emb_device = "gpu"
train_batch_size = 56
ppo_mini_batch_size = 56
ppo_micro_batch_size = 1
max_prompt_length = 512
max_response_length = 512
ppo_max_token_len_per_gpu = 8192
rwkv_use_dynamic_bsz = false
actor_lr = "1e-5"
rollout_n = 8
trainer_n_gpus_per_node = 7
rollout_n_gpus_per_node = 1
rollout_mode = "async"
rollout_tensor_parallel_size = 1
rollout_data_parallel_size = 1
rollout_pipeline_parallel_size = 1
rollout_checkpoint_engine_backend = "nccl"
rollout_correction_bypass_mode = true
total_epochs = 2
save_freq = 20
test_freq = -1

[datasets.gsm8k]
# When root is omitted, the CLI uses ${DATASETS_PATH}/gsm8k.

[models."g1g-1.5b"]
file = "rwkv7-g1g-1.5b-20260526-ctx8192.pth"
served_model_name = "g1g-1.5b"
max_model_len = 8192

[models."g1d-0.4b"]
path = "/home/chase/GitHub/rwkv-rs/pth/rwkv7-g1d-0.4b-20260210-ctx8192.pth"
served_model_name = "g1d-0.4b"
max_model_len = 8192

[models."g1d-0.4b".infer]
vllm_bin = "/home/chase/GitHub/vllm-rwkv/.venv/bin/vllm"
wkv_mode = "fp16"
emb_device = "gpu"
gpu_memory_utilization = 0.45
max_num_seqs = 8
max_num_batched_tokens = 8192

[models."g1d-0.4b".infer.vllm_env]
VLLM_WSL2_ENABLE_PIN_MEMORY = "1"
VLLM_USE_RAPID_SAMPLER = "0"
VLLM_USE_FLASHINFER_SAMPLER = "0"

[models."g1g-7.2b"]
file = "rwkv7-g1g-7.2b-20260523-ctx8192.pth"
served_model_name = "g1g-7.2b"
max_model_len = 8192
