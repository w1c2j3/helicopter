# Server evaluation preset. Endpoint, API keys, judge, and database live in .env.remote.

[model_catalog]
path = "configs/models/g1h-dual-replica.toml"

[benchmarks]
index = "configs/benchmarks/famous120.toml"

[prompt]
mode = "naive_nocot"
template = "User: {query}\nAssistant: <think></think"
allowed_domains = ["math", "coding", "instruction_following", "knowledge"]

[prompt.formats.multiturn]
tasks = ["mt_bench"]
multi_turn_template = "{first_prompt}{first_answer}\nUser: {query}\nAssistant: <think></think"

[prompt.formats.math_boxed]
task_prefixes = ["math:"]
template = "User: {query}\nAssistant:<think></think"

[prompt.formats.python_function]
tasks = ["human_eval", "human_eval_plus", "human_eval_fix", "mbpp", "mbpp_plus", "classeval"]
task_prefixes = ["human_eval"]
template = "User: {query}\n\nAssistant: <think>\n</think>\n```python"

[prompt.formats.python_program]
tasks = ["livecodebench", "codecontests", "apps"]
task_prefixes = ["lcb:"]
template = "User: {query}\n\nAssistant: <think>\n</think>\n```python"

[prompt.formats.python_snippet]
tasks = ["bigcodebench", "bigcodebench_hard", "ds_1000", "deveval", "codereval", "scicode"]
template = "User: {query}\n\nAssistant: <think>\n</think>\n```python"

[prompt.formats.diff_patch]
tasks = ["swe_bench_pro_public", "swe_bench_verified", "swe_bench", "swe_bench_lite", "swe_bench_live", "swe_bench_multilingual", "multi_swe_bench", "aider_polyglot"]
task_prefixes = ["swe_bench"]
template = "User: {query}\n\nAssistant: <think>\n</think>\n```diff"

[prompt.formats.generic_code]
tasks = ["multipl_e", "debugbench"]
template = "User: {query}\n\nAssistant: <think>\n</think>\n```"

[prompt.formats.code_completion]
tasks = ["repobench", "crosscodeeval"]
template = "User: {query}\nAssistant: <think></think"

[prompt.formats.code_reasoning]
tasks = ["cruxeval", "cruxeval_x"]
template = "User: {query}\nAssistant: <think></think"

[prompt.formats.code_retrieval]
tasks = ["codesearchnet"]
template = "User: {query}\nAssistant: <think></think"

[prompt.formats.choice]
domains = ["coding"]
template = "User: {query}\nAssistant: <think></think"

[prompt.formats.open_qa]
tasks = ["coqa", "simpleqa", "squad_v2", "natural_questions", "triviaqa", "drop"]
template = "User: {query}\nAssistant: <think></think"

[prompt.formats.pubmedqa]
tasks = ["pubmedqa"]
template = "User: {query}\nAssistant: <think></think"

[prompt.domains.math]
template = "User: {query}\nAssistant:<think></think"

[prompt.domains.knowledge]
template = "User: {query}\nAssistant: <think></think"

[stops]
inherit_task_stops = false

[stops.domains]
math = ["\nUser:"]
coding = ["\nUser:"]
instruction_following = ["\nUser:"]
knowledge = ["\nUser:", "\nQuestion:", "\n**Question:**", "\nAssistant:"]

[stops.formats]
python_function = ["\n```"]
python_program = ["\n```"]
python_snippet = ["\n```"]
diff_patch = ["\n```"]
generic_code = ["\n```"]

[sampling]
max_tokens = 2048
temperature = 0.96
top_p = 0.76
top_k = 32
presence_penalty = 1.0
frequency_penalty = 0.1
penalty_decay = 0.988

[sampling.domains.instruction_following]
max_tokens = 1280

[sampling.domains.math]
max_tokens = 2048

[sampling.domains.knowledge]
max_tokens = 512

[sampling.formats.choice]
max_tokens = 512

[sampling.formats.python_function]
max_tokens = 2048

[sampling.formats.python_program]
max_tokens = 4096

[sampling.formats.python_snippet]
max_tokens = 2048

[sampling.formats.diff_patch]
max_tokens = 4096

[sampling.formats.generic_code]
max_tokens = 4096

[sampling.formats.code_completion]
max_tokens = 2048

[sampling.formats.code_reasoning]
max_tokens = 512

[sampling.formats.code_retrieval]
max_tokens = 512

[sampling.formats.open_qa]
max_tokens = 20

[sampling.formats.pubmedqa]
max_tokens = 3

[lighteval]
provider = "openai"
output_dir = "results/lighteval"
save_details = false
dataset_loading_processes = 1
load_tasks_multilingual = false
custom_tasks = "src/cli/helicopter_cli/lighteval_rwkv_skills_tasks.py"
concurrent_requests = 8
request_timeout = 900

[lighteval.g1h]
metric = "avg"
prompt_style = "naive"
zero_shot = true
avg_k = 8
rollout_n = 8
target_generations_per_benchmark = 5000
large_benchmark_generation_threshold = 20000
large_benchmark_sample_rate = 0.2
generation_size = 2048
gpass_generation_size = 4096
variant_selection = "avg_then_gpass"

[function_calling]
concurrent_requests = 8
request_timeout = 180
