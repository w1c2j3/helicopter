# Server evaluation preset. Endpoint, API keys, judge, and database live in .env.remote.

[model_catalog]
path = "configs/models/g1h-dual-replica.toml"

[benchmarks]
index = "configs/benchmarks/famous120.toml"

[prompt]
mode = "normal_cot"
template = "User✿{query}✿\nBot✿<think"
allowed_domains = ["math", "knowledge"]

[prompt.formats.math_boxed]
task_prefixes = ["math:"]
template = "User✿{query}✿\nBot✿<think"

[prompt.domains.knowledge]
template = "User✿{query}✿\nBot✿<think"

[stops]
inherit_task_stops = false

[stops.domains]
math = ["✿"]
knowledge = ["✿"]

[sampling]
max_tokens = 2048
temperature = 0.96
top_p = 0.76
top_k = 32
presence_penalty = 1.0
frequency_penalty = 0.1
penalty_decay = 0.988

[lighteval]
provider = "openai"
output_dir = "results/lighteval"
save_details = false
dataset_loading_processes = 1
load_tasks_multilingual = false
custom_tasks = "src/cli/helicopter_cli/lighteval_rwkv_skills_tasks.py"
concurrent_requests = 8
request_timeout = 900

[lighteval.g1h]
metric = "avg"
prompt_style = "normal"
zero_shot = true
avg_k = 8
rollout_n = 8
target_generations_per_benchmark = 5000
large_benchmark_generation_threshold = 20000
large_benchmark_sample_rate = 0.2
generation_size = 2048
gpass_generation_size = 4096
variant_selection = "avg_then_gpass"

[function_calling]
concurrent_requests = 8
request_timeout = 180
